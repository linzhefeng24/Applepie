name: Publish manually tuned core extension diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-manual-core-extension-20261119
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_DELIVERY_ROOT: research/manual-extension-review-20261119
      TRANSLATION_RELEASE_TAG: manual-core-extension-20261119
      TRANSLATION_BUNDLE: Core_Extension_Transport.zip
      TRANSLATION_RELEASE_TITLE: 'Manual R2 core extension: 171 cells, targeted causal diagnostics'
      TRANSLATION_RELEASE_NOTES: 'Source-traced MaleCNS extension of the frozen manual model, 17 full-network conditions, explicit unmeasured membrane priors, selected I1 gain2 candidate and independently verified from-initial-state rerun. Includes exact named-cell feedback and E2-to-MN route tests. Not a claim of laboratory behavior reproduction or independent local pacemaking. Original R2 package unchanged; no BPTT training restarted.'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chinese-translations-20261118
            research/manual-extension-review-20261119
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct, publish and freshly verify diagnostic bundle
        run: python research/chinese-translations-20261118/publish.py publish
