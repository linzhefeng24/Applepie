name: Build complete standalone fixed-body model download
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-full-download.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/single-model-delivery-20261115/
            /research/fixed-body-video-20261115/
            /research/full-download-20261115/
            /research/rhythm-pathway-audit-20261115/
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/neurons.json
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/unsigned-connectivity.npz
            /research/brake-retuning-20261115/results/terminal-r2/BRK.npz
            /research/brake-retuning-20261115/configs/brake-terminal-r2.json
            /research/conductance-rebuild-20261114/data/model-130-channel-candidate-crosswalk.csv
            /research/assets/flymimic-legacy-AB-twofile.zip
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-unified-r9/PFL3L-config.json
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-r9/BRK-config.json
            /research/conductance-rebuild-20261114/data/phenomena-inventory.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/single-model-delivery-20261115/runtime/requirements.txt
      - name: Install native EGL renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
      - name: Build the same single model and run DN input
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/single-model-delivery-20261115/build.py
          python research/single-model-delivery-20261115/build/UnifiedFlyModel/02_code/run.py neural --experiment DN_drive
      - name: Download verified existing fixed-body results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/full-download-20261115/build
          gh release download fixed-body-video-20261115 --repo "$GITHUB_REPOSITORY" --pattern FixedBody_20261115.zip --dir research/full-download-20261115/build
      - name: Assemble complete package and test fresh extraction
        env:
          MUJOCO_GL: egl
          OPENBLAS_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/full-download-20261115/assemble.py
          python research/single-model-delivery-20261115/verify_distribution.py research/full-download-20261115/dist/UnifiedFlyModel_Full_20261115.zip --report research/full-download-20261115/dist/full-download-verification.json
      - name: Upload full package to existing published Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload fixed-body-video-20261115 research/full-download-20261115/dist/UnifiedFlyModel_Full_20261115.zip research/full-download-20261115/dist/UnifiedFlyModel_Full_20261115.manifest.json research/full-download-20261115/dist/full-download-verification.json --repo "$GITHUB_REPOSITORY" --clobber
