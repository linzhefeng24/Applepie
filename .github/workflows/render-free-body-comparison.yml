name: Free body versus direct target replay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-free-body-comparison.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/single-model-delivery-20261115/
            /research/free-body-target-comparison-20261116/
            /research/conductance-rebuild-20261114/data/old-A-muscle-targets.npz
            /research/conductance-rebuild-20261114/grouped_parameters.py
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/neurons.json
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/unsigned-connectivity.npz
            /research/brake-retuning-20261115/results/terminal-r2/BRK.npz
            /research/brake-retuning-20261115/configs/brake-terminal-r2.json
            /research/conductance-rebuild-20261114/data/model-130-channel-candidate-crosswalk.csv
            /research/assets/flymimic-legacy-AB-twofile.zip
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-unified-r9/PFL3L-config.json
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-r9/BRK-config.json
            /research/conductance-rebuild-20261114/data/phenomena-inventory.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/single-model-delivery-20261115/runtime/requirements.txt
      - name: Install native EGL renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
      - name: Build unchanged base model
        run: python research/single-model-delivery-20261115/build.py
      - name: Fetch verified full-network state archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/free-body-target-comparison-20261116/cache
          gh release download fixed-body-video-20261115 --repo "$GITHUB_REPOSITORY" --pattern 'BPTT_Epoch123_1000_State.zip' --dir research/free-body-target-comparison-20261116/cache
      - name: Run three unconstrained body replays
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          MUJOCO_GL: egl
          MPLCONFIGDIR: /tmp/bptt-video-plot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python research/free-body-target-comparison-20261116/render.py
      - name: Save videos and states to existing download Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload fixed-body-video-20261115 research/free-body-target-comparison-20261116/results/*.mp4 research/free-body-target-comparison-20261116/results/*.zip research/free-body-target-comparison-20261116/results/*.json research/free-body-target-comparison-20261116/results/*.jpg --repo "$GITHUB_REPOSITORY" --clobber
