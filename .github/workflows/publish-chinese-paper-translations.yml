name: Publish verified Chinese full-paper translations
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-chinese-paper-translations-20261118
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/chinese-translations-20261118
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct SHA256-checked bundle and publish Release assets
        run: python research/chinese-translations-20261118/publish.py publish
