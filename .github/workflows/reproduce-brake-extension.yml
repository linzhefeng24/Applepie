name: Reproduce brake-extension scientific traces
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reproduce-brake-extension.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brake-extension-rerun
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared numerical dependencies
        run: python -m pip install -r research/conductance-rebuild-20261114/requirements.txt
      - name: Independently rerun four conditions
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        working-directory: research/conductance-rebuild-20261114
        run: |
          for mode in control MDN BRK MDN+BRK; do
            python pulse_neural_panel.py "$mode" configs/manual-neural-bank-r9.json brake-extension-remote results/mcns-brake-extension .0125 annotated-MN
          done
      - name: Bundle explicitly remote rerun
        run: |
          tar -C research -czf brake-extension-remote-traces-20261115.tar.gz conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-remote
          python - <<'PY'
          import json,hashlib,os,pathlib
          p=pathlib.Path('brake-extension-remote-traces-20261115.tar.gz')
          d={'status':'independent GitHub-runner rerun; not a backup of the locally generated raw files','code_revision':os.environ['GITHUB_SHA'],'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          pathlib.Path('brake-extension-remote-manifest.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Back up remote rerun to existing draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload brake-extension-traces-20261115 brake-extension-remote-traces-20261115.tar.gz brake-extension-remote-manifest.json --repo "$GITHUB_REPOSITORY" --clobber
