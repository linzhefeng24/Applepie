name: Evaluate and render completed native joint BPTT300
on:
  workflow_run:
    workflows: [Manual-anchor native joint-trajectory BPTT 300]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finalize-native-joint-bptt-300-20261116
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.progress.outputs.ready }}
      source: ${{ steps.progress.outputs.source }}
    steps:
      - id: progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import subprocess,json,base64,os
          result=subprocess.run(['gh','api',f"repos/{os.environ['REPO']}/contents/research/joint-bptt-300-20261116/progress.json?ref=main"],capture_output=True,text=True,check=True)
          data=json.loads(base64.b64decode(json.loads(result.stdout)['content']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(data['completed_updates']>=300).lower()+'\n')
              output.write('source='+data['source_revision']+'\n')
          print('Actual main updates:',data['completed_updates'],'/300')
          PY
  evaluate:
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIN_SOURCE_REF: ${{ needs.inspect.outputs.source }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MUJOCO_GL: egl
      XLA_FLAGS: --xla_cpu_multi_thread_eigen=false --xla_cpu_enable_fast_math=false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/joint-bptt-300-20261116/
            /research/physics-bptt-20261116/source/
            /research/surrogate-bptt-20261115/input-identity.json
            /research/single-model-delivery-20261115/
            /research/conductance-rebuild-20261114/grouped_parameters.py
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/neurons.json
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/unsigned-connectivity.npz
            /research/brake-retuning-20261115/results/terminal-r2/BRK.npz
            /research/brake-retuning-20261115/configs/brake-terminal-r2.json
            /research/conductance-rebuild-20261114/data/model-130-channel-candidate-crosswalk.csv
            /research/conductance-rebuild-20261114/data/phenomena-inventory.json
            /research/assets/flymimic-legacy-AB-twofile.zip
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-unified-r9/PFL3L-config.json
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-r9/BRK-config.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned runtime and native renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
          python -m pip install -r research/joint-bptt-300-20261116/requirements.txt
      - name: Rebuild manual bank and restore completed optimizer
        run: |
          python research/single-model-delivery-20261115/build.py
          python research/joint-bptt-300-20261116/patch_mjx.py
          python research/joint-bptt-300-20261116/checkpoint_service.py restore
      - name: Evaluate and render manual versus best versus300 on original AB
        run: python research/joint-bptt-300-20261116/finalize.py
