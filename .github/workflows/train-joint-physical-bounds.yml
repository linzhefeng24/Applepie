name: Physical-range warm-start joint BPTT 300
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source revision; blank uses dispatch revision
        required: false
        default: ''
      chunk_updates:
        description: Pilot or main updates per job, with automatic continuation
        required: false
        default: '10'
permissions:
  contents: write
  actions: write
concurrency:
  group: native-joint-bptt-physical-bounds-20261117
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIN_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_cpu_multi_thread_eigen=false --xla_cpu_enable_fast_math=false
      PYTHONDONTWRITEBYTECODE: '1'
      MPLCONFIGDIR: /tmp/joint-plots
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TRAIN_SOURCE_REF }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/joint-bptt-physical-bounds-20261117/
            /research/physics-bptt-20261116/source/
            /research/surrogate-bptt-20261115/input-identity.json
            /research/single-model-delivery-20261115/
            /research/conductance-rebuild-20261114/grouped_parameters.py
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/neurons.json
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/unsigned-connectivity.npz
            /research/brake-retuning-20261115/results/terminal-r2/BRK.npz
            /research/brake-retuning-20261115/configs/brake-terminal-r2.json
            /research/conductance-rebuild-20261114/data/model-130-channel-candidate-crosswalk.csv
            /research/conductance-rebuild-20261114/data/phenomena-inventory.json
            /research/assets/flymimic-legacy-AB-twofile.zip
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-unified-r9/PFL3L-config.json
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-r9/BRK-config.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated pinned neural and physical libraries
        run: python -m pip install -r research/joint-bptt-physical-bounds-20261117/requirements.txt
      - name: Build and verify the original manually tuned bank
        run: |
          python research/single-model-delivery-20261115/build.py
          python research/joint-bptt-physical-bounds-20261117/patch_mjx.py
      - name: Restore exact optimizer, immutable source, and actual update counts
        env:
          SYNC_SERVICE_REF: ${{ github.sha }}
        run: |
          python - <<'PY'
          import subprocess,json,base64,os,hashlib
          from pathlib import Path
          name='research/joint-bptt-physical-bounds-20261117/checkpoint_service.py'
          data=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/{name}?ref={os.environ['SYNC_SERVICE_REF']}"],text=True))
          raw=base64.b64decode(data['content']);Path(name).write_bytes(raw)
          print('Synchronization service revision:',os.environ['SYNC_SERVICE_REF'],'SHA256:',hashlib.sha256(raw).hexdigest())
          PY
          python research/joint-bptt-physical-bounds-20261117/checkpoint_service.py restore
      - name: Train on native0.4s joint trajectories from best parent87 with manual regularizer
        env:
          SYNC_EVERY_SAVE: '1'
          CHUNK_UPDATES: ${{ inputs.chunk_updates }}
        run: python research/joint-bptt-physical-bounds-20261117/train_chunk.py --updates "$CHUNK_UPDATES"
      - name: Freshly verify checkpoint and automatically continue toward300
        env:
          NEXT_CHUNK_UPDATES: ${{ inputs.chunk_updates }}
        run: |
          python research/joint-bptt-physical-bounds-20261117/checkpoint_service.py publish
          python research/joint-bptt-physical-bounds-20261117/checkpoint_service.py dispatch
