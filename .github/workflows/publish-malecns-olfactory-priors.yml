name: Publish MaleCNS olfactory structure and physiology priors
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-malecns-olfactory-priors-20261119
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_DELIVERY_ROOT: research/malecns-olfactory-physiology-20261119
      TRANSLATION_RELEASE_TAG: malecns-olfactory-priors-20261119
      TRANSLATION_BUNDLE: MaleCNS_Olfactory_Structure_and_Physiology.zip
      TRANSLATION_RELEASE_TITLE: 'MaleCNS olfactory candidate structure and adult physiological priors'
      TRANSLATION_RELEASE_NOTES: 'Verified extraction of 8286 candidate MaleCNS v1.0 cells and 1492168 directed pairs, with original IDs, source identities, cell-specific dynamical design, 48 physiological evidence entries including 15 unresolved entries, and local depression-equation checks. This is a structural and parameter-prior foundation, NOT a calibrated or functioning whole olfactory simulation. Original third-party simulation code is referenced by immutable revision, not redistributed.'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chinese-translations-20261118
            research/malecns-olfactory-physiology-20261119
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct archive, publish and verify downloaded SHA256
        run: python research/chinese-translations-20261118/publish.py publish
