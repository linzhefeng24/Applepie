name: Publish validated low-memory add-on
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-lowmem-addon-20261116
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: research/joint-bptt-300-20261116/lowmem
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check full-scope evidence and build additive ZIP
        run: python research/joint-bptt-300-20261116/lowmem/package.py --out /tmp/applepie-lowmem
      - name: Publish and freshly download artifact before saving manifest
        run: python research/joint-bptt-300-20261116/lowmem/publish.py /tmp/applepie-lowmem
