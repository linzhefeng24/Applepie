name: Publish complete manual R2 free-body replay
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-manual-freebody-20261119
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_DELIVERY_ROOT: research/manual-freebody-package-20261119
      TRANSLATION_RELEASE_TAG: manual-r2-freebody-20261119
      TRANSLATION_BUNDLE: Manual_FreeBody_Delivery_Transport.zip
      TRANSLATION_RELEASE_TITLE: 'Manual R2: free-body videos with complete original parameters'
      TRANSLATION_RELEASE_NOTES: 'Replaces the fixed-body add-on for current use. Includes unmodified pre-BPTT R2 neural model and decoded parameters, original native AB physical parameters, standalone code, source-verified neural states, newly integrated free-body states and three new videos. No optimizer checkpoints loaded, no fixed root or rescue forces. Canonical0.4s AB replay,3x neural clock, original11 auxiliary schedules. Not proof of long-term stable walking. Old fixed-body assets remain historical records.'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chinese-translations-20261118
            research/manual-freebody-package-20261119
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct, publish and freshly download hash-verified assets
        run: python research/chinese-translations-20261118/publish.py publish
