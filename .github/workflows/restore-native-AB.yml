name: Restore native AB and compare saved checkpoints
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-native-AB.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/restore-native-AB-20261116/
            /research/assets/flymimic-legacy-AB-twofile.zip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4 mujoco==3.3.2 PyYAML==6.0.3 Pillow==12.0.0 imageio-ffmpeg==0.6.0
      - name: Install native EGL renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
      - name: Fetch verified full-network neural outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/restore-native-AB-20261116/cache
          gh release download fixed-body-video-20261115 --repo "$GITHUB_REPOSITORY" --pattern 'FreeBody_Comparison_Bundle.zip' --dir research/restore-native-AB-20261116/cache
      - name: Restore original AB and run matched neural comparisons
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          MUJOCO_GL: egl
          MPLCONFIGDIR: /tmp/bptt-video-plot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python research/restore-native-AB-20261116/replay_compare.py
      - name: Save videos and states to existing download Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload fixed-body-video-20261115 research/restore-native-AB-20261116/results/*.mp4 research/restore-native-AB-20261116/results/*.zip research/restore-native-AB-20261116/results/*.json research/restore-native-AB-20261116/results/*.jpg --repo "$GITHUB_REPOSITORY" --clobber
