name: Build and archive single neuromuscular model
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-single-model-delivery.yml'
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/single-model-delivery-20261115/
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/neurons.json
            /research/conductance-rebuild-20261114/results/mcns-brake-extension/unsigned-connectivity.npz
            /research/brake-retuning-20261115/results/terminal-r2/BRK.npz
            /research/brake-retuning-20261115/configs/brake-terminal-r2.json
            /research/conductance-rebuild-20261114/data/model-130-channel-candidate-crosswalk.csv
            /research/assets/flymimic-legacy-AB-twofile.zip
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-unified-r9/PFL3L-config.json
            /research/conductance-rebuild-20261114/results/frozen-neural-panel-brake-extension-r9/BRK-config.json
            /research/conductance-rebuild-20261114/data/phenomena-inventory.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/single-model-delivery-20261115/runtime/requirements.txt
      - name: Reconstruct unique model and check exact frozen equivalence
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python research/single-model-delivery-20261115/build.py
          python research/single-model-delivery-20261115/verify_source.py
      - name: Run full neural to body demo and render actual videos
        working-directory: research/single-model-delivery-20261115/build/UnifiedFlyModel
        env:
          OPENBLAS_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          MUJOCO_GL: egl
          MPLCONFIGDIR: /tmp/unified-fly-plot
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: python 02_code/run.py demo --experiment DN_drive
      - name: Decode videos, validate results and create distribution
        run: python research/single-model-delivery-20261115/finalize.py
      - name: Back up deliverable to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view unified-fly-model-20261115 --repo "$GITHUB_REPOSITORY" || gh release create unified-fly-model-20261115 --draft --target "$GITHUB_SHA" --title 'Unified single neuromuscular model 2026-11-15' --notes 'One parameter file, runnable dynamics and actual synchronized videos. Candidate muscle mapping; stable walking is not validated.' --repo "$GITHUB_REPOSITORY"
          gh release upload unified-fly-model-20261115 research/single-model-delivery-20261115/dist/UnifiedFlyModel_20261115.zip research/single-model-delivery-20261115/dist/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
