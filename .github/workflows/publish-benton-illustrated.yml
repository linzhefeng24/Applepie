name: Publish Benton Chinese illustrated edition
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-benton-illustrated-20261119
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_DELIVERY_ROOT: research/benton-inline-figures-20261119
      TRANSLATION_RELEASE_TAG: benton-illustrated-zh-20261119
      TRANSLATION_BUNDLE: Benton_2025_Chinese_Illustrated.zip
      TRANSLATION_RELEASE_TITLE: 'Benton 2025: Chinese translation with figures beside captions'
      TRANSLATION_RELEASE_NOTES: 'Unofficial Chinese reading translation of Benton et al. 2025, DOI 10.1038/s44319-025-00476-8. All six main figures and two extended figures are reproduced immediately before their Chinese captions. Original figure labels and bibliography retained. Original CC BY4.0; modifications are translation and layout. Includes PDF, Word and standalone HTML.'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            research/chinese-translations-20261118
            research/benton-inline-figures-20261119
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publish and freshly download SHA256-verified assets
        run: python research/chinese-translations-20261118/publish.py publish
