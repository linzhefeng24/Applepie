name: Add matched training reference to73-update comparison
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-reference-preview73
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MUJOCO_GL: egl
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research/joint-bptt-300-20261116/
            /research/assets/flymimic-legacy-AB-twofile.zip
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgl1
          python -m pip install -r research/joint-bptt-300-20261116/requirements.txt
      - name: Reuse verified73-update states and add matched reference poses
        run: |
          mkdir -p research/joint-bptt-300-20261116/cache/reference-preview
          gh release download joint-preview-20261117-e0073 --repo "${{ github.repository }}" --pattern Joint_Epoch73_Replay.zip --dir research/joint-bptt-300-20261116/cache/reference-preview
          python research/joint-bptt-300-20261116/add_reference_video.py --replay research/joint-bptt-300-20261116/cache/reference-preview/Joint_Epoch73_Replay.zip --out research/joint-bptt-300-20261116/cache/reference-preview/result
      - name: Publish reference-only and four-panel videos and verified provenance
        run: python research/joint-bptt-300-20261116/publish_checkpoint_video.py research/joint-bptt-300-20261116/cache/reference-preview/result
